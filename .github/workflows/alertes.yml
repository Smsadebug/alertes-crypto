name: Alertes crypto

on:
  schedule:
    - cron: "3 * * * *"   # toutes les heures, juste apres la cloture de la bougie horaire
  workflow_dispatch:       # bouton "Run workflow" pour tester a la main

permissions:
  contents: write          # pour sauvegarder le portefeuille fictif

concurrency:
  group: alertes
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifier les signaux
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL_EUR: ${{ secrets.CAPITAL_EUR }}
        run: python alertes_crypto.py --status && python alertes_crypto.py --once
      - name: Portefeuille fictif
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL_EUR: ${{ secrets.CAPITAL_EUR }}
          PAPER_CAPITAL: ${{ secrets.CAPITAL_EUR }}
        run: python paper.py
      - name: Sauvegarder le portefeuille fictif
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state.json
          git diff --staged --quiet || (git commit -m "Portefeuille fictif" && git push)
