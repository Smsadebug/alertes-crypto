name: Backtest strategie

on:
  workflow_dispatch:   # se lance uniquement a la main

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester la strategie sur 1 an
        run: python backtest.py
